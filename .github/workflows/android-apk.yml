name: Build Livescore Android APK

on:
  push:
    branches:
      - main
      - feature/installable-pwa
    paths:
      - 'android-twa/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure release signing
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/livescore-release.keystore"

          cat > android-twa/key.properties <<EOF_PROPERTIES
          storeFile=$RUNNER_TEMP/livescore-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF_PROPERTIES

      - name: Build signed release APK
        working-directory: android-twa
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: livescore-by-cheke-v2.0.0-apk
          path: android-twa/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public Android download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v2.0.0
          name: LiveScore by Cheke Android v2.0.0
          body: |
            LiveScore by Cheke Android v2.0.0

            - Updated glass-inspired LiveScore launcher icon.
            - Branded Android launch screen.
            - Animated glass loading experience when the app opens.
            - Signed release APK for direct Android installation.

            Download the APK below and install it on your Android device.
          files: android-twa/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
