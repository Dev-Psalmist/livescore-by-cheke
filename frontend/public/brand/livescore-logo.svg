<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" role="img" aria-labelledby="title desc">
  <title id="title">LiveScore by Cheke</title>
  <desc id="desc">A premium emerald and silver multi-sport shield logo.</desc>

  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b25"/>
      <stop offset="1" stop-color="#050b0a"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#aebbb7"/>
      <stop offset="1" stop-color="#65736e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6dffbd"/>
      <stop offset="1" stop-color="#00a86b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield -->
  <path d="M88 10 L158 34 L151 112 Q145 145 88 169 Q31 145 25 112 L18 34 Z"
        fill="url(#shield)" stroke="url(#silver)" stroke-width="4"/>
  <path d="M88 20 L148 41 L142 109 Q136 137 88 158 Q40 137 34 109 L28 41 Z"
        fill="none" stroke="#00c982" stroke-width="2.5"/>

  <!-- Speed lines -->
  <path d="M48 58 H75 M42 68 H68 M108 58 H132 M112 68 H136"
        stroke="#00c982" stroke-width="3" stroke-linecap="round" opacity=".8"/>

  <!-- Multi-sport ball -->
  <circle cx="88" cy="88" r="34" fill="#071310" stroke="url(#silver)" stroke-width="3"/>
  <circle cx="88" cy="88" r="29" fill="none" stroke="#00c982" stroke-width="1.5" opacity=".8"/>

  <!-- Basketball-style curved seams -->
  <path d="M88 54 C72 68 72 108 88 122 M88 54 C104 68 104 108 88 122"
        fill="none" stroke="#d7e3de" stroke-width="2" opacity=".9"/>
  <path d="M59 88 H117 M64 72 C78 82 98 82 112 72 M64 104 C78 94 98 94 112 104"
        fill="none" stroke="#d7e3de" stroke-width="1.7" opacity=".75"/>

  <!-- Emerald pulse -->
  <path d="M62 90 H76 L83 78 L94 101 L101 88 H115"
        fill="none" stroke="url(#green)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Wordmark -->
  <text x="190" y="91" fill="#f4f8f6" font-family="Arial, Helvetica, sans-serif"
        font-size="49" font-weight="900" letter-spacing="1.2">LIVESCORE</text>
  <rect x="193" y="108" width="78" height="4" rx="2" fill="#00c982"/>
  <text x="193" y="139" fill="#aebbb7" font-family="Arial, Helvetica, sans-serif"
        font-size="21" font-weight="600" letter-spacing="5">BY CHEKE</text>
  <text x="355" y="139" fill="#6dffbd" font-family="Arial, Helvetica, sans-serif"
        font-size="10" font-weight="700" letter-spacing="2">EVERY SPORT. EVERY MOMENT.</text>
</svg>
